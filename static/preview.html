<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#ffffff" />
<title>首页 · 我的工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   个人工作台 · 极简风 · 绿色点缀
   ============================================================ */
:root {
  --bg: #f7f8f6;
  --surface: #ffffff;
  --surface-2: #f3f5f3;
  --border: #e8ebe8;
  --border-2: #f0f2f0;
  --text: #1a1d1a;
  --text-2: #6b726b;
  --text-3: #a8aea8;

  --accent: #16a34a;
  --accent-d: #15803d;
  --accent-soft: #ecfdf5;
  --on-accent: #fff;

  --radius: 14px;
  --radius-sm: 10px;
  --radius-lg: 20px;

  --shadow: 0 1px 3px rgba(0,0,0,.04);
  --shadow-lg: 0 4px 20px rgba(0,0,0,.06);

  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-display: "Sora", -apple-system, "PingFang SC", system-ui, sans-serif;

  --tabbar-h: 60px;
  --ease: cubic-bezier(.16,1,.3,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font);
  font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  padding-bottom: calc(var(--tabbar-h) + 24px); /* 额外留白防遮挡 */
  position: relative; min-height: 100%;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
svg { display: block; }

/* ---------- 顶栏 ---------- */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px 12px;
  background: var(--bg);
  position: sticky; top: 0; z-index: 20;
  backdrop-filter: blur(8px);
}
.topbar .title { font-family: var(--font-display); font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
.topbar .date { font-size: 12px; color: var(--text-3); font-family: var(--font-display); font-weight: 400; }

/* ---------- 主内容 ---------- */
.main { padding: 8px 20px 32px; animation: fade .4s var(--ease) both; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes popIn { 0% { transform: scale(.85); } 100% { transform: scale(1); } }

/* ---------- 问候区（极简：大字 + 绿色细线） ---------- */
.greet { padding: 8px 0 28px; }
.greet h2 {
  font-family: var(--font-display); font-size: 24px; font-weight: 700;
  letter-spacing: -.02em; line-height: 1.3;
}
.greet h2 .hl { color: var(--accent); }
.greet p { font-size: 13px; color: var(--text-3); margin-top: 6px; }

/* ---------- 统计卡片 ---------- */
.stat-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; margin-bottom: 28px; }
.stat-card {
  background: var(--surface); border: 1px solid var(--border-2);
  border-radius: var(--radius); padding: 16px 18px;
  transition: border-color .2s var(--ease), transform .2s var(--ease);
}
.stat-card:active { transform: scale(.97); }
.stat-card .label { font-size: 12px; color: var(--text-3); font-weight: 500; }
.stat-card .val {
  font-family: var(--font-display); font-size: 26px; font-weight: 700;
  margin-top: 4px; letter-spacing: -.02em; display: flex; align-items: baseline; gap: 3px;
}
.stat-card .val small { font-family: var(--font); font-size: 12px; color: var(--text-3); font-weight: 400; }
/* 仅在今日习惯卡片上点缀绿色 */
.stat-card.accent .val { color: var(--accent); }

/* ---------- 区块标题 ---------- */
.sec-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px; padding: 0 2px;
}
.sec-head h3 { font-family: var(--font-display); font-size: 15px; font-weight: 600; }
.sec-head .badge {
  font-size: 11px; color: var(--accent); font-weight: 600;
  background: var(--accent-soft); padding: 2px 8px; border-radius: 6px;
}

/* ---------- 列表项（极简：细分割线，无背景） ---------- */
.list-card {
  background: var(--surface); border: 1px solid var(--border-2);
  border-radius: var(--radius); overflow: hidden; margin-bottom: 24px;
}
.list-item {
  display: flex; align-items: center; gap: 12px; padding: 14px 16px;
  border-bottom: 1px solid var(--border-2); transition: background .15s;
}
.list-item:last-child { border-bottom: none; }
.list-item:active { background: var(--surface-2); }
.list-item .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.list-item .dot.green { background: var(--accent); }
.list-item .dot.blue { background: #6b9bd1; }
.list-item .dot.amber { background: #d4a72c; }
.list-item .dot.sage { background: #8aa882; }
.list-item .txt { flex: 1; min-width: 0; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-item .time {
  font-size: 12px; color: var(--text-3); flex-shrink: 0;
  font-family: var(--font-display); font-weight: 400;
}

/* ---------- 习惯卡片 ---------- */
.habit-card {
  background: var(--surface); border: 1px solid var(--border-2);
  border-radius: var(--radius); padding: 18px; margin-bottom: 14px;
}
.habit-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.habit-emoji { font-size: 26px; width: 42px; height: 42px; display: grid; place-items: center; background: var(--surface-2); border-radius: 12px; flex-shrink: 0; }
.habit-name { font-family: var(--font-display); font-size: 15px; font-weight: 600; }
.habit-streak { font-size: 12px; color: var(--text-3); margin-top: 1px; }
.habit-streak .fire { color: var(--accent); }
.habit-week { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; margin-bottom: 14px; }
.hw-cell {
  aspect-ratio: 1; border-radius: 7px; display: grid; place-items: center;
  font-size: 10px; background: var(--surface-2); color: var(--text-3);
  font-weight: 500; font-family: var(--font-display);
  transition: all .15s var(--ease);
}
.hw-cell.done {
  background: var(--accent); color: #fff;
  animation: popIn .25s var(--ease);
}
.hw-cell.today { outline: 1.5px solid var(--accent); outline-offset: 1px; }
.check-btn {
  width: 100%; padding: 11px; border-radius: var(--radius-sm);
  font-weight: 600; font-size: 14px;
  background: var(--surface-2); color: var(--text-2);
  border: 1px solid transparent; transition: all .18s var(--ease);
}
.check-btn:active { transform: scale(.97); }
.check-btn.checked {
  background: var(--accent); color: var(--on-accent);
}
.check-btn.checked:hover { background: var(--accent-d); }

/* ---------- 页面切换（预览用） ---------- */
.preview-switch {
  display: flex; gap: 4px; background: var(--surface-2);
  border-radius: 8px; padding: 3px;
}
.ps-btn { font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 6px; color: var(--text-3); transition: all .2s; }
.ps-btn.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.06); }

/* ---------- 底部导航 ---------- */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: var(--tabbar-h);
  background: rgba(255,255,255,.92); backdrop-filter: blur(16px);
  border-top: 1px solid var(--border);
  display: flex; justify-content: space-around; align-items: center;
  z-index: 50; padding-bottom: env(safe-area-inset-bottom,0);
}
.tab-item {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  color: var(--text-3); font-size: 10px; font-weight: 500;
  flex: 1; padding: 6px 0; transition: color .2s var(--ease);
}
.tab-item.active { color: var(--accent); }
.tab-item svg { width: 22px; height: 22px; transition: all .2s var(--ease); }
.tab-item.active svg { transform: scale(1.06); }
/* 绿色点缀：激活项顶部细线 */
.tab-item.active::before {
  content: ""; position: absolute; top: 0; width: 24px; height: 2px;
  background: var(--accent); border-radius: 0 0 2px 2px;
}
.tab-item { position: relative; }
</style>
</head>
<body>

<div class="topbar">
  <span class="title">工作台</span>
  <div style="display:flex; align-items:center; gap:10px;">
    <div class="preview-switch">
      <button class="ps-btn active" data-page="home">首页</button>
      <button class="ps-btn" data-page="habits">习惯</button>
    </div>
  </div>
</div>

<div class="main">
  <!-- 首页 -->
  <section id="page-home">
    <div class="greet">
      <h2 id="greet">下午好，<span class="hl">开始今天的工作吧</span></h2>
      <p id="greetSub">9月9日 · 周三</p>
    </div>

    <div class="stat-grid">
      <div class="stat-card"><div class="label">本周已办</div><div class="val">12.5<small>小时</small></div></div>
      <div class="stat-card"><div class="label">已办条目</div><div class="val">18<small>条</small></div></div>
      <div class="stat-card"><div class="label">待办总数</div><div class="val">24<small>项</small></div></div>
      <div class="stat-card accent"><div class="label">今日习惯</div><div class="val">3<small>/5</small></div></div>
    </div>

    <div class="sec-head"><h3>今日已办</h3><span class="badge">4 条</span></div>
    <div class="list-card">
      <div class="list-item"><span class="dot blue"></span><span class="txt">完成首页原型设计</span><span class="time">09:00</span></div>
      <div class="list-item"><span class="dot sage"></span><span class="txt">用户调研访谈</span><span class="time">11:00</span></div>
      <div class="list-item"><span class="dot amber"></span><span class="txt">整理需求文档</span><span class="time">14:00</span></div>
      <div class="list-item"><span class="dot blue"></span><span class="txt">代码评审</span><span class="time">16:00</span></div>
    </div>

    <div class="sec-head"><h3>进行中</h3><span class="badge">3 项</span></div>
    <div class="list-card">
      <div class="list-item"><span class="dot green"></span><span class="txt">UI 设计稿优化</span><span class="time">明天</span></div>
      <div class="list-item"><span class="dot blue"></span><span class="txt">后端接口对接</span><span class="time">3天</span></div>
      <div class="list-item"><span class="dot sage"></span><span class="txt">性能测试报告</span><span class="time">5天</span></div>
    </div>
  </section>

  <!-- 习惯页 -->
  <section id="page-habits" style="display:none;">
    <div class="greet">
      <h2>习惯<span class="hl">打卡</span></h2>
      <p>坚持的力量，每天一点点</p>
    </div>

    <div class="sec-head"><h3>今日</h3><span class="badge">3/5</span></div>

    <div class="habit-card">
      <div class="habit-top">
        <span class="habit-emoji">🏃</span>
        <div><div class="habit-name">锻炼</div><div class="habit-streak"><span class="fire">●</span> 连续 5 天</div></div>
      </div>
      <div class="habit-week">
        <div class="hw-cell done">03</div><div class="hw-cell done">04</div><div class="hw-cell done">05</div>
        <div class="hw-cell done">06</div><div class="hw-cell done">07</div><div class="hw-cell done">08</div>
        <div class="hw-cell today">09</div>
      </div>
      <button class="check-btn checked">✓ 今日已完成</button>
    </div>

    <div class="habit-card">
      <div class="habit-top">
        <span class="habit-emoji">💧</span>
        <div><div class="habit-name">喝水</div><div class="habit-streak"><span class="fire">●</span> 连续 12 天</div></div>
      </div>
      <div class="habit-week">
        <div class="hw-cell done">03</div><div class="hw-cell done">04</div><div class="hw-cell done">05</div>
        <div class="hw-cell done">06</div><div class="hw-cell done">07</div><div class="hw-cell done">08</div>
        <div class="hw-cell today">09</div>
      </div>
      <button class="check-btn">点击打卡</button>
    </div>
  </section>
</div>

<nav class="tabbar" id="tabbar"></nav>

<script>
const NAV = [
  { id:'home', label:'首页', icon:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg>' },
  { id:'todos', label:'待办', icon:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v6l-4.5 8.5a2 2 0 0 0 1.8 3h11.4a2 2 0 0 0 1.8-3L15 9V3"/><path d="M8 3h8"/></svg>' },
  { id:'calendar', label:'日历', icon:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="2"/><path d="M16 2.5v4M8 2.5v4M3 10h18"/></svg>' },
  { id:'stats', label:'统计', icon:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v17.5h18"/><rect x="6.5" y="12" width="3" height="6"/><rect x="11.5" y="8" width="3" height="10"/><rect x="16.5" y="5" width="3" height="13"/></svg>' },
  { id:'habits', label:'习惯', icon:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21.2l8.9-8.9a5.5 5.5 0 0 0 0-7.7z"/></svg>' },
];
document.getElementById('tabbar').innerHTML =
  NAV.map(it=>`<a class="tab-item ${it.id==='home'?'active':''}">${it.icon}<span>${it.label}</span></a>`).join('');

document.querySelectorAll('.ps-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.ps-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const p = btn.dataset.page;
    document.getElementById('page-home').style.display = p === 'home' ? '' : 'none';
    document.getElementById('page-habits').style.display = p === 'habits' ? '' : 'none';
    document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-item')[p === 'home' ? 0 : 4].classList.add('active');
  });
});

document.querySelectorAll('.check-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    btn.classList.toggle('checked');
    btn.textContent = btn.classList.contains('checked') ? '✓ 今日已完成' : '点击打卡';
  });
});

(function(){
  const h = new Date().getHours();
  const g = h < 6 ? '夜深了' : h < 12 ? '早上好' : h < 14 ? '中午好' : h < 18 ? '下午好' : '晚上好';
  document.getElementById('greet').innerHTML = g + '，<span class="hl">开始今天的工作吧</span>';
  const d = new Date();
  const W = ['日','一','二','三','四','五','六'];
  document.getElementById('greetSub').textContent = `${d.getMonth()+1}月${d.getDate()}日 · 周${W[d.getDay()]}`;
})();
</script>
</body>
</html>
