<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>首页 · 我的工作台</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="layout" id="layout"></div>
<nav class="tabbar" id="tabbar"></nav>
<div class="main">
  <div class="greet">
    <h2 id="greet">你好</h2>
    <p id="greetSub">—</p>
  </div>
  <div class="stat-grid">
    <div class="card stat-card"><div class="label">本周已办总时长</div><div class="val" id="statWeekTime">0<small>小时</small></div></div>
    <div class="card stat-card"><div class="label">本周已办条目</div><div class="val" id="statWeekCount">0<small>条</small></div></div>
    <div class="card stat-card"><div class="label">待办总数</div><div class="val" id="statTodoTotal">0<small>项</small></div></div>
    <div class="card stat-card"><div class="label">今日习惯</div><div class="val" id="statHabitToday">0<small>/0</small></div></div>
  </div>
  <div class="dash-row">
    <div class="dash-col">
      <h3>今日已办</h3>
      <div class="mini-list" id="dashTodayDone"><div class="tree-empty">加载中...</div></div>
    </div>
    <div class="dash-col">
      <h3>进行中的待办</h3>
      <div class="mini-list" id="dashOngoing"><div class="tree-empty">加载中...</div></div>
    </div>
  </div>
</div>
<script src="common.js"></script>
<script>
document.getElementById('layout').innerHTML = renderNav('index');
document.getElementById('tabbar').innerHTML = NAV_ITEMS.map(it =>
  `<a class="tab-item ${it.id==='index'?'active':''}" href="${it.href}">${it.icon}<span>${it.label}</span></a>`
).join('');

let todos = [], dones = [], habits = [];

async function load() {
  [todos, dones, habits] = await Promise.all([API.todos(), API.dones(), API.habits()]);
  render();
}

function render() {
  const now = new Date();
  document.getElementById('greet').textContent = greeting() + '，开始今天的工作吧';
  document.getElementById('greetSub').textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 · 周${['日','一','二','三','四','五','六'][now.getDay()]}`;

  const today = fmtDate(now);
  const todayDones = dones.filter(d => d.date === today);

  const ws = startOfWeek(now);
  const weekDones = dones.filter(d => {
    const dt = new Date(d.date);
    return dt >= ws && dt < new Date(ws.getTime()+7*86400000);
  });
  const weekMin = weekDones.reduce((s,d)=>s+durationMin(d.start_time,d.end_time), 0);

  document.getElementById('statWeekTime').innerHTML = `${(weekMin/60).toFixed(1)}<small>小时</small>`;
  document.getElementById('statWeekCount').innerHTML = `${weekDones.length}<small>条</small>`;
  document.getElementById('statTodoTotal').innerHTML = `${todos.length}<small>项</small>`;

  const todayHabit = habits.filter(h => {
    const r = h.records.find(r => r.date === today);
    return r && (h.type === 'check' ? r.value : r.value > 0);
  }).length;
  document.getElementById('statHabitToday').innerHTML = `${todayHabit}<small>/${habits.length}</small>`;

  const tdList = document.getElementById('dashTodayDone');
  if (todayDones.length === 0) {
    tdList.innerHTML = '<div class="tree-empty">今天还没有记录</div>';
  } else {
    tdList.innerHTML = todayDones.map(d => {
      const color = d.todo_id ? todoColor(todos, d.todo_id) : 'var(--module-3)';
      return `<div class="mini-item"><span class="dot" style="background:${color}"></span><span class="txt">${esc(d.title)}</span><span class="time">${d.start_time}-${d.end_time}</span></div>`;
    }).join('');
  }

  const ongoing = todos.filter(t => !t.done && !t.parent_id).slice(0, 6);
  const ogList = document.getElementById('dashOngoing');
  if (ongoing.length === 0) {
    ogList.innerHTML = '<div class="tree-empty">暂无进行中的待办</div>';
  } else {
    ogList.innerHTML = ongoing.map(t => {
      const mins = todoTime(todos, dones, t.id);
      const cnt = todoDoneCount(todos, dones, t.id);
      return `<div class="mini-item"><span class="dot" style="background:${todoColor(todos,t.id)}"></span><span class="txt">${esc(t.title)}</span><span class="time">${cnt}条 · ${fmtMin(mins)}</span></div>`;
    }).join('');
  }
}

load();
</script>
</body>
</html>
