<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>习惯打卡 · 我的工作台</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="layout" id="layout"></div>
<nav class="tabbar" id="tabbar"></nav>
<div class="main">
  <div class="page-head">
    <div><h2>习惯打卡</h2><div class="sub">锻炼、读书、喝水、睡眠等日常记录</div></div>
    <button class="btn primary" id="addHabit"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>添加习惯</button>
  </div>
  <div class="habit-grid" id="habitGrid"><div class="tree-empty">加载中...</div></div>
</div>
<script src="common.js"></script>
<script>
document.getElementById('layout').innerHTML = renderNav('habits');
document.getElementById('tabbar').innerHTML = NAV_ITEMS.map(it =>
  `<a class="tab-item ${it.id==='habits'?'active':''}" href="${it.href}">${it.icon}<span>${it.label}</span></a>`
).join('');

let habits = [];

async function load() {
  habits = await API.habits();
  render();
}

function render() {
  const grid = document.getElementById('habitGrid');
  if (habits.length === 0) {
    grid.innerHTML = '<div class="tree-empty">还没有习惯，点击「添加习惯」开始</div>';
    return;
  }
  const today = fmtDate(new Date());
  const last7 = [];
  for (let i=6; i>=0; i--) {
    const d = new Date(); d.setDate(d.getDate()-i);
    last7.push(fmtDate(d));
  }
  grid.innerHTML = habits.map(h => {
    const todayRec = h.records.find(r => r.date === today);
    const todayVal = todayRec ? todayRec.value : (h.type==='check' ? false : 0);
    const streak = calcStreak(h);
    const weekCells = last7.map(d => {
      const r = h.records.find(x => x.date === d);
      const done = r && (h.type==='check' ? r.value : r.value > 0);
      const isToday = d === today;
      return `<div class="hw-cell ${done?'done':''} ${isToday?'today':''}" title="${d}${r?(' '+formatHabitVal(h,r.value)):''}">${d.slice(8)}</div>`;
    }).join('');

    let inputHtml;
    if (h.type === 'check') {
      inputHtml = `<button class="check-btn ${todayVal?'checked':''}" onclick="toggleHabit('${h.id}')">${todayVal?'✓ 今日已完成':'点击打卡'}</button>`;
    } else if (h.type === 'number') {
      inputHtml = `<div class="habit-input">
        <button class="step-btn" onclick="stepHabit('${h.id}',-1)">−</button>
        <span class="val">${todayVal}</span>
        <button class="step-btn" onclick="stepHabit('${h.id}',1)">+</button>
        <span style="color:var(--text-secondary);font-size:13px;">${h.unit}</span>
      </div>`;
    } else {
      inputHtml = `<div class="habit-input">
        <input type="number" step="0.5" min="0" max="24" value="${todayVal}" style="width:90px;" onchange="setHabit('${h.id}', parseFloat(this.value)||0)">
        <span style="color:var(--text-secondary);font-size:13px;">${h.unit}</span>
      </div>`;
    }

    return `<div class="card habit-card">
      <div class="habit-top">
        <span class="habit-emoji">${h.emoji}</span>
        <div><div class="habit-name">${esc(h.name)}</div><div class="habit-streak">🔥 连续 ${streak} 天</div></div>
      </div>
      <div class="habit-week">${weekCells}</div>
      ${inputHtml}
      <div class="habit-foot"><span style="font-size:11.5px;color:var(--text-tertiary);">最近7天</span>
        <button class="del-habit" onclick="delHabit('${h.id}')">删除</button></div>
    </div>`;
  }).join('');
}

function formatHabitVal(h, v) {
  if (h.type === 'check') return v ? '已打卡' : '未打卡';
  return v + h.unit;
}
function calcStreak(h) {
  let streak = 0;
  const d = new Date();
  while (true) {
    const ds = fmtDate(d);
    const r = h.records.find(x => x.date === ds);
    const done = r && (h.type==='check' ? r.value : r.value > 0);
    if (done) { streak++; d.setDate(d.getDate()-1); }
    else {
      if (ds === fmtDate(new Date()) && streak === 0) { d.setDate(d.getDate()-1); continue; }
      break;
    }
  }
  return streak;
}
function setHabitRecordLocal(h, val) {
  const today = fmtDate(new Date());
  const r = h.records.find(x => x.date === today);
  if (r) r.value = val; else h.records.push({ date: today, value: val });
}
async function toggleHabit(id) {
  const h = habits.find(x => x.id === id); if (!h) return;
  const today = fmtDate(new Date());
  const r = h.records.find(x => x.date === today);
  const cur = r ? r.value : false;
  const next = !cur;
  setHabitRecordLocal(h, next);
  await API.setHabitRecord(id, { date: today, value: next });
  render();
}
async function stepHabit(id, delta) {
  const h = habits.find(x => x.id === id); if (!h) return;
  const today = fmtDate(new Date());
  const r = h.records.find(x => x.date === today);
  const cur = r ? r.value : 0;
  const next = Math.max(0, cur + delta);
  setHabitRecordLocal(h, next);
  await API.setHabitRecord(id, { date: today, value: next });
  render();
}
async function setHabit(id, val) {
  const h = habits.find(x => x.id === id); if (!h) return;
  const today = fmtDate(new Date());
  setHabitRecordLocal(h, val);
  await API.setHabitRecord(id, { date: today, value: val });
  render();
}
async function delHabit(id) {
  if (!confirm('删除这个习惯？历史记录也会清除。')) return;
  await API.deleteHabit(id);
  habits = habits.filter(h => h.id !== id);
  render(); toast('已删除');
}

document.getElementById('addHabit').addEventListener('click', () => {
  const html = `
    <div class="field"><label>习惯名称</label><input type="text" id="hName" placeholder="例如：跑步"></div>
    <div class="field"><label>图标 (emoji)</label><input type="text" id="hEmoji" value="🌟" placeholder="emoji"></div>
    <div class="field"><label>记录类型</label>
      <select id="hType">
        <option value="check">打卡（完成/未完成）</option>
        <option value="number">数值（如喝水杯数）</option>
        <option value="time">时长（如睡眠小时）</option>
      </select>
    </div>
    <div class="field"><label>单位（数值/时长类型）</label><input type="text" id="hUnit" placeholder="杯 / 小时 / 页"></div>
  `;
  openModal('添加习惯', html, async () => {
    const name = document.getElementById('hName').value.trim();
    if (!name) { toast('请填写名称'); return; }
    const h = {
      name, emoji: document.getElementById('hEmoji').value.trim() || '🌟',
      type: document.getElementById('hType').value, unit: document.getElementById('hUnit').value.trim()
    };
    const res = await API.createHabit(h);
    h.id = res.id; h.records = [];
    habits.push(h);
    render(); closeModal(); toast('已添加');
  });
});

load();
</script>
</body>
</html>
