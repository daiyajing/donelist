<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>我的工作台</title>
<style>
  /* ============================================================
     THEME TOKENS
     ============================================================ */
  :root {
    --page-bg: #f4f3f0;
    --surface-card: #fcfbf8;
    --surface-nested: #f7f6f1;
    --border: #ecebe5;
    --border-input: #e0ded6;
    --text: #232220;
    --text-secondary: #7a7468;
    --text-tertiary: #b6b1a6;
    --accent: #2f2e2b;
    --accent-muted: #efeee8;
    --on-accent: #f4f3f0;
    --module-1: #6f8f6a;
    --module-2: #5f7a99;
    --module-3: #bd8a4e;
    --module-4: #b5715a;
    --module-5: #7d7195;
    --danger: #c25d4f;
    --danger-muted: #f6ece9;
    --drawer-bg: #232220;
    --drawer-bg-top: #2d2c29;
    --drawer-text: #f4f3f0;
    --drawer-text-mute: rgba(244,243,240,.55);
    --drawer-hover: rgba(244,243,240,.08);
    --drawer-active: rgba(244,243,240,.14);
    --radius-control: 8px;
    --radius-tile: 12px;
    --radius-card: 16px;
    --radius-sheet: 22px;
    --shadow-card: 0 1px 2px rgba(35,34,32,.04), 0 4px 16px rgba(35,34,32,.05);
    --shadow-overlay: 0 10px 28px rgba(35,34,32,.12);
    --font: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --sidebar-w: 248px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--page-bg); color: var(--text); font-family: var(--font);
    font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, textarea, select { font-family: inherit; font-size: 14px; color: var(--text); }
  textarea { resize: vertical; }
  svg { display: block; }
  .hidden { display: none !important; }

  /* ---------- layout ---------- */
  .layout { display: flex; min-height: 100vh; }
  .sidebar {
    background: linear-gradient(180deg, var(--drawer-bg-top), var(--drawer-bg));
    color: var(--drawer-text); width: var(--sidebar-w); flex-shrink: 0;
    display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
  }
  .brand { padding: 26px 22px 18px; }
  .brand h1 { font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
  .brand p { font-size: 11.5px; opacity: .55; margin-top: 4px; letter-spacing: .04em; }
  .nav { flex: 1; overflow-y: auto; padding: 6px 12px 16px; }
  .nav-item {
    display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 11px;
    cursor: pointer; font-size: 14px; font-weight: 500; color: rgba(244,243,240,.78);
    transition: background .15s; margin-bottom: 2px;
  }
  .nav-item:hover { background: var(--drawer-hover); }
  .nav-item.active { background: var(--drawer-active); color: var(--drawer-text); font-weight: 700; }
  .nav-item svg { color: var(--drawer-text-mute); flex-shrink: 0; }
  .nav-item.active svg { color: var(--drawer-text); }
  .nav-sep { font-size: 10.5px; opacity: .4; padding: 16px 14px 6px; letter-spacing: .12em; text-transform: uppercase; }

  .main { flex: 1; min-width: 0; padding: 28px 36px 48px; }
  .view { display: none; }
  .view.active { display: block; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .page-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 22px; }
  .page-head h2 { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
  .page-head .sub { color: var(--text-secondary); font-size: 13px; margin-top: 2px; }

  /* ---------- cards & buttons ---------- */
  .card { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow-card); }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: var(--radius-tile);
    font-size: 13.5px; font-weight: 600; border: 1px solid var(--border-input); background: var(--surface-card);
    color: var(--text); transition: background .15s;
  }
  .btn:hover { background: var(--surface-nested); }
  .btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .btn.primary:hover { opacity: .92; }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.ghost:hover { background: var(--surface-nested); }
  .btn.danger { color: var(--danger); border-color: transparent; }
  .btn.danger:hover { background: var(--danger-muted); }
  .btn.sm { padding: 5px 9px; font-size: 12.5px; }
  .icon-btn {
    width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
    color: var(--text-secondary); transition: background .15s;
  }
  .icon-btn:hover { background: var(--surface-nested); color: var(--text); }

  input[type="text"], input[type="number"], input[type="time"], input[type="date"], select, textarea {
    width: 100%; padding: 9px 12px; border: 1px solid var(--border-input); border-radius: var(--radius-tile);
    background: var(--surface-card); outline: none; transition: border-color .15s;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { min-height: 72px; line-height: 1.55; }
  label { display: block; font-size: 12.5px; color: var(--text-secondary); font-weight: 600; margin-bottom: 6px; }
  .field { margin-bottom: 14px; }

  /* ---------- modal ---------- */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(35,34,32,.42); z-index: 100;
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-mask.show { display: flex; animation: fade .2s ease; }
  .modal {
    background: var(--surface-card); border-radius: var(--radius-sheet); box-shadow: var(--shadow-overlay);
    width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; padding: 22px 24px 20px;
  }
  .modal h3 { font-size: 17px; font-weight: 800; margin-bottom: 16px; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 6px; }

  /* ============================================================
     DASHBOARD
     ============================================================ */
  .greet {
    background: linear-gradient(135deg, var(--accent) 0%, #4a4842 100%); color: var(--on-accent);
    border-radius: var(--radius-card); padding: 28px 30px; margin-bottom: 22px; position: relative; overflow: hidden;
  }
  .greet::after {
    content: ""; position: absolute; right: -40px; top: -40px; width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(244,243,240,.12), transparent 70%);
  }
  .greet h2 { font-size: 26px; font-weight: 800; }
  .greet p { opacity: .7; margin-top: 6px; font-size: 13.5px; }
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 22px; }
  .stat-card { padding: 18px 20px; }
  .stat-card .label { font-size: 12.5px; color: var(--text-secondary); font-weight: 600; }
  .stat-card .val { font-size: 28px; font-weight: 800; margin-top: 4px; letter-spacing: -.02em; }
  .stat-card .val small { font-size: 14px; color: var(--text-secondary); font-weight: 600; margin-left: 4px; }
  .dash-row { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; }
  .dash-col h3 { font-size: 14px; font-weight: 700; margin-bottom: 12px; color: var(--text-secondary); letter-spacing: .02em; }
  .mini-list { display: flex; flex-direction: column; gap: 8px; }
  .mini-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-tile);
    background: var(--surface-nested); font-size: 13.5px;
  }
  .mini-item .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .mini-item .time { margin-left: auto; color: var(--text-tertiary); font-size: 12px; }

  /* ============================================================
     MIND MAP TODOS
     ============================================================ */
  .todo-toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .tree { padding: 4px 0; }
  .tnode {
    display: flex; align-items: flex-start; gap: 6px; padding: 5px 0; border-radius: var(--radius-tile);
    transition: background .15s;
  }
  .tnode:hover { background: var(--surface-nested); }
  .tnode-row { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; padding: 4px 6px; }
  .caret { width: 20px; height: 20px; flex-shrink: 0; display: grid; place-items: center; border-radius: 6px; color: var(--text-tertiary); }
  .caret.has-child:hover { background: var(--border); color: var(--text); }
  .caret svg { transition: transform .18s; }
  .caret.open svg { transform: rotate(90deg); }
  .cb {
    width: 18px; height: 18px; border-radius: 6px; border: 1.5px solid var(--border-input); flex-shrink: 0;
    display: grid; place-items: center; cursor: pointer; transition: all .15s;
  }
  .cb:hover { border-color: var(--accent); }
  .cb.checked { background: var(--module-1); border-color: var(--module-1); }
  .cb.checked svg { color: #fff; }
  .t-title {
    font-size: 14px; font-weight: 500; cursor: pointer; padding: 2px 4px; border-radius: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0;
  }
  .t-title.done { text-decoration: line-through; color: var(--text-tertiary); }
  .t-title:hover { background: var(--surface-nested); }
  .t-title[contenteditable="true"] { outline: 2px solid var(--accent); background: var(--surface-card); }
  .t-meta { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .chip {
    font-size: 11.5px; padding: 2px 8px; border-radius: 20px; background: var(--surface-nested);
    color: var(--text-secondary); font-weight: 600; white-space: nowrap;
  }
  .chip.time { color: var(--module-2); }
  .chip.note { color: var(--module-5); }
  .t-actions { display: flex; gap: 2px; opacity: 0; transition: opacity .15s; }
  .tnode:hover .t-actions { opacity: 1; }
  .tree-children { margin-left: 22px; border-left: 1.5px dashed var(--border); padding-left: 8px; }
  .tree-empty { text-align: center; color: var(--text-tertiary); padding: 40px 20px; font-size: 13.5px; }

  /* ============================================================
     CALENDAR
     ============================================================ */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .cal-head h3 { font-size: 18px; font-weight: 800; }
  .cal-nav { display: flex; gap: 6px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-dow { text-align: center; font-size: 12px; font-weight: 700; color: var(--text-tertiary); padding: 6px 0; }
  .cal-cell {
    background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-tile);
    min-height: 110px; padding: 6px; cursor: pointer; transition: all .15s; display: flex; flex-direction: column; gap: 3px;
  }
  .cal-cell:hover { border-color: var(--accent); box-shadow: var(--shadow-card); }
  .cal-cell.other { opacity: .35; }
  .cal-cell.today { border-color: var(--accent); border-width: 1.5px; }
  .cal-num { font-size: 12.5px; font-weight: 700; color: var(--text-secondary); }
  .cal-cell.today .cal-num { color: var(--accent); }
  .cal-block {
    font-size: 11px; padding: 2px 6px; border-radius: 5px; background: var(--surface-nested); color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 3px solid var(--module-2);
  }
  .cal-block.more { background: var(--surface-nested); color: var(--text-secondary); font-size: 11px; }
  .cal-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 14px; }
  .cal-legend .lg { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
  .cal-legend .sw { width: 10px; height: 10px; border-radius: 3px; }

  /* day detail modal */
  .day-records { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .day-rec {
    display: flex; align-items: flex-start; gap: 10px; padding: 12px; border-radius: var(--radius-tile);
    background: var(--surface-nested);
  }
  .day-rec .bar { width: 4px; align-self: stretch; border-radius: 4px; flex-shrink: 0; }
  .day-rec .rbody { flex: 1; min-width: 0; }
  .day-rec .rtitle { font-weight: 700; font-size: 14px; }
  .day-rec .rmeta { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .day-rec .rnote { font-size: 13px; color: var(--text); margin-top: 6px; white-space: pre-wrap; }

  /* ============================================================
     STATISTICS
     ============================================================ */
  .stat-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .week-total { font-size: 15px; }
  .week-total b { font-size: 22px; color: var(--module-2); }
  .bar-chart {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; align-items: end;
    height: 160px; padding: 14px; background: var(--surface-nested); border-radius: var(--radius-card);
    margin-bottom: 22px;
  }
  .bar-col { display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; justify-content: flex-end; }
  .bar-wrap { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
  .bar {
    width: 28px; background: var(--module-2); border-radius: 6px 6px 0 0; min-height: 2px;
    transition: height .3s ease; position: relative;
  }
  .bar .tv { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--text-secondary); font-weight: 600; white-space: nowrap; }
  .bar-col .dl { font-size: 11.5px; color: var(--text-secondary); font-weight: 600; }
  .stat-sections { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .stat-section { padding: 16px; }
  .stat-section h4 { font-size: 14px; font-weight: 700; margin-bottom: 12px; color: var(--text-secondary); }
  .todo-stat-row {
    display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .todo-stat-row:last-child { border-bottom: none; }
  .todo-stat-row:hover { background: var(--surface-nested); }
  .todo-stat-row .ts-title { flex: 1; font-size: 13.5px; }
  .todo-stat-row .ts-time { font-weight: 700; color: var(--module-2); font-size: 13px; }
  .breakdown { margin-top: 10px; padding-left: 14px; border-left: 2px solid var(--border); display: none; flex-direction: column; gap: 8px; }
  .breakdown.show { display: flex; }
  .bd-item { font-size: 12.5px; padding: 6px 0; }
  .bd-item .bd-date { color: var(--text-secondary); margin-right: 8px; }
  .bd-item .bd-time { color: var(--module-2); font-weight: 600; }
  .bd-item .bd-note { color: var(--text-secondary); margin-top: 3px; white-space: pre-wrap; }

  /* ============================================================
     HABITS
     ============================================================ */
  .habit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .habit-card { padding: 18px; }
  .habit-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .habit-emoji { font-size: 28px; }
  .habit-name { font-size: 15px; font-weight: 700; }
  .habit-streak { font-size: 12px; color: var(--text-secondary); }
  .habit-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 12px; }
  .hw-cell {
    aspect-ratio: 1; border-radius: 7px; display: grid; place-items: center; font-size: 10.5px;
    background: var(--surface-nested); color: var(--text-secondary); font-weight: 600;
  }
  .hw-cell.done { background: var(--module-1); color: #fff; }
  .hw-cell.today { outline: 2px solid var(--accent); }
  .habit-input { display: flex; align-items: center; gap: 8px; }
  .habit-input .val { font-size: 22px; font-weight: 800; color: var(--accent); min-width: 40px; text-align: center; }
  .step-btn {
    width: 32px; height: 32px; border-radius: 9px; background: var(--surface-nested); color: var(--text);
    display: grid; place-items: center; font-size: 18px; font-weight: 700; transition: background .15s;
  }
  .step-btn:hover { background: var(--border-input); }
  .check-btn {
    width: 100%; padding: 10px; border-radius: var(--radius-tile); font-weight: 700; font-size: 13.5px;
    background: var(--surface-nested); color: var(--text-secondary); border: 1.5px solid transparent;
  }
  .check-btn.checked { background: var(--module-1); color: #fff; }
  .habit-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  .del-habit { color: var(--text-tertiary); font-size: 12px; }

  /* toast */
  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: var(--accent);
    color: var(--on-accent); padding: 10px 18px; border-radius: var(--radius-tile); font-size: 13.5px;
    box-shadow: var(--shadow-overlay); z-index: 200; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border-input); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }

  @media (max-width: 900px) {
    .sidebar { position: fixed; transform: translateX(-100%); z-index: 50; transition: transform .25s; }
    .sidebar.open { transform: translateX(0); }
    .main { padding: 18px; }
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
    .dash-row, .stat-sections { grid-template-columns: 1fr; }
    .mobile-bar { display: flex; }
  }
  .mobile-bar { display: none; align-items: center; gap: 10px; padding: 12px 16px; background: var(--drawer-bg); color: var(--drawer-text); }
  .mobile-bar h1 { font-size: 16px; font-weight: 800; }
</style>
</head>
<body>
<div class="layout">
  <!-- sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <h1>我的工作台</h1>
      <p id="greetDate">—</p>
    </div>
    <nav class="nav">
      <div class="nav-sep">导航</div>
      <div class="nav-item active" data-view="dash"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>首页</div>
      <div class="nav-item" data-view="todos"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v6l-5 9a2 2 0 0 0 2 3h12a2 2 0 0 0 2-3l-5-9V3"/><path d="M9 3h6"/></svg>思维待办</div>
      <div class="nav-item" data-view="cal"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>日历</div>
      <div class="nav-item" data-view="stat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="5" width="3" height="13"/></svg>统计</div>
      <div class="nav-item" data-view="habit"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>习惯打卡</div>
    </nav>
  </aside>

  <div style="flex:1;min-width:0;">
    <div class="mobile-bar">
      <button class="icon-btn" onclick="document.getElementById('sidebar').classList.toggle('open')" style="color:var(--drawer-text)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <h1>我的工作台</h1>
    </div>
    <main class="main">

      <!-- DASHBOARD -->
      <section class="view active" id="v-dash">
        <div class="greet">
          <h2 id="dashGreet">你好</h2>
          <p id="dashSub">—</p>
        </div>
        <div class="stat-grid">
          <div class="card stat-card"><div class="label">本周已办总时长</div><div class="val" id="statWeekTime">0<small>小时</small></div></div>
          <div class="card stat-card"><div class="label">本周已办条目</div><div class="val" id="statWeekCount">0<small>条</small></div></div>
          <div class="card stat-card"><div class="label">待办总数</div><div class="val" id="statTodoTotal">0<small>项</small></div></div>
          <div class="card stat-card"><div class="label">今日习惯</div><div class="val" id="statHabitToday">0<small>/0</small></div></div>
        </div>
        <div class="dash-row">
          <div class="dash-col">
            <h3>今日已办</h3>
            <div class="mini-list" id="dashTodayDone"><div class="tree-empty">今天还没有记录</div></div>
          </div>
          <div class="dash-col">
            <h3>进行中的待办</h3>
            <div class="mini-list" id="dashOngoing"><div class="tree-empty">暂无进行中的待办</div></div>
          </div>
        </div>
      </section>

      <!-- TODOS -->
      <section class="view" id="v-todos">
        <div class="page-head">
          <div><h2>思维待办</h2><div class="sub">以大纲层级组织，自由建立上下级关系，关联已办与备注</div></div>
        </div>
        <div class="todo-toolbar">
          <button class="btn primary" id="addRootTodo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>添加根待办</button>
          <button class="btn" id="expandAll"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>全部展开</button>
          <button class="btn" id="collapseAll">全部收起</button>

        <div class="card" style="padding:14px 16px;">
          <div class="tree" id="todoTree"></div>
        </div>

      <!-- CALENDAR -->
      <section class="view" id="v-cal">
        <div class="page-head">
          <div><h2>日历</h2><div class="sub">记录每个时间块做了什么，可关联到待办</div></div>
        </div>
        <div class="card" style="padding:18px;">
          <div class="cal-head">
            <button class="btn sm" id="prevMonth">‹ 上月</button>
            <h3 id="calTitle">—</h3>
            <button class="btn sm" id="nextMonth">下月 ›</button>
          </div>
          <div class="cal-grid" id="calDows"></div>
          <div class="cal-grid" id="calGrid"></div>
          <div class="cal-legend" id="calLegend"></div>
        </div>
      </section>

      <!-- STATISTICS -->
      <section class="view" id="v-stat">
        <div class="page-head">
          <div><h2>统计</h2><div class="sub">本周用时与待办进展汇总</div></div>
        </div>
        <div class="card" style="padding:18px;">
          <div class="stat-toolbar">
            <button class="btn sm" id="prevWeek">‹ 上周</button>
            <div class="week-total" id="weekRange">—</div>
            <button class="btn sm" id="nextWeek">下周 ›</button>
            <div class="week-total" style="margin-left:auto;">本周合计 <b id="weekTotal">0</b> 小时（<span id="weekCount">0</span> 条）</div>
          </div>
          <div class="bar-chart" id="barChart"></div>
          <div class="stat-sections">
            <div class="card stat-section">
              <h4>各待办用时</h4>
              <div id="todoStats"></div>
            </div>
            <div class="card stat-section">
              <h4>无关联已办</h4>
              <div id="orphanStats"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- HABITS -->
      <section class="view" id="v-habit">
        <div class="page-head">
          <div><h2>习惯打卡</h2><div class="sub">锻炼、读书、喝水、睡眠等日常记录</div></div>
          <button class="btn primary" id="addHabit"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>添加习惯</button>
        </div>
        <div class="habit-grid" id="habitGrid"></div>
      </section>

    </main>
  </div>
</div>

<!-- modal -->
<div class="modal-mask" id="modalMask">
  <div class="modal" id="modalBox">
    <h3 id="modalTitle">标题</h3>
    <div id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   STATE & STORAGE
   ============================================================ */
const STORE_KEY = 'my-workbench-v1';
let state = {
  todos: [],
  dones: [],
  habits: [],
  calMonth: new Date(),
  statWeek: startOfWeek(new Date())
};

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      state.todos = s.todos || [];
      state.dones = s.dones || [];
      state.habits = s.habits || [];
    }
  } catch(e) { console.warn(e); }
  if (state.todos.length === 0 && state.dones.length === 0 && state.habits.length === 0) seed();
}
function save() { localStorage.setItem(STORE_KEY, JSON.stringify({ todos: state.todos, dones: state.dones, habits: state.habits })); }
function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }

function seed() {
  const now = new Date();
  const today = fmtDate(now);
  state.todos = [
    { id: 't1', title: '产品设计', parentId: null, note: 'Q4 重点项目，需要完成交互稿与视觉稿', done: false, expanded: true, order: 0 },
    { id: 't2', title: '完成首页原型', parentId: 't1', note: '参考竞品 A、B 的布局', done: false, expanded: true, order: 0 },
    { id: 't3', title: '用户调研访谈', parentId: 't1', note: '', done: true, expanded: false, order: 1 },
    { id: 't4', title: '技术方案', parentId: null, note: '', done: false, expanded: true, order: 1 },
    { id: 't5', title: '数据库表设计', parentId: 't4', note: '注意索引与分表', done: false, expanded: false, order: 0 },
  ];
  const yd = fmtDate(new Date(now.getTime() - 86400000));
  state.dones = [
    { id: 'd1', title: '梳理首页信息架构', todoId: 't2', date: today, start: '09:30', end: '11:00', note: '确定了三大模块的优先级' },
    { id: 'd2', title: '竞品分析报告', todoId: 't2', date: today, start: '14:00', end: '15:30', note: '整理了 5 个竞品的截图' },
    { id: 'd3', title: '阅读《设计心理学》', todoId: null, date: yd, start: '21:00', end: '22:00', note: '第 3 章' },
  ];
  state.habits = [
    { id: 'h1', name: '锻炼', emoji: '🏃', type: 'check', unit: '', records: [{ date: yd, value: true }] },
    { id: 'h2', name: '读书', emoji: '📚', type: 'check', unit: '', records: [{ date: today, value: true }] },
    { id: 'h3', name: '喝水', emoji: '💧', type: 'number', unit: '杯', records: [{ date: today, value: 4 }] },
    { id: 'h4', name: '睡眠', emoji: '😴', type: 'time', unit: '小时', records: [{ date: today, value: 7.5 }] },
  ];
  save();
}

/* ============================================================
   UTILS
   ============================================================ */
function fmtDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function startOfWeek(d) {
  const nd = new Date(d);
  const day = (nd.getDay() + 6) % 7; // Mon=0
  nd.setDate(nd.getDate() - day);
  nd.setHours(0,0,0,0);
  return nd;
}
function durationMin(start, end) {
  const [sh, sm] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  let mins = eh*60+em - (sh*60+sm);
  if (mins < 0) mins += 24*60;
  return mins;
}
function fmtMin(m) {
  const h = Math.floor(m/60), min = m%60;
  if (h === 0) return `${min}分`;
  if (min === 0) return `${h}小时`;
  return `${h}小时${min}分`;
}
function getChildren(pid) { return state.todos.filter(t => t.parentId === pid).sort((a,b)=>a.order-b.order); }
function getTodo(id) { return state.todos.find(t => t.id === id); }
function todoTime(id) {
  // total time of dones linked to this todo AND its descendants
  let total = 0;
  const stack = [id];
  const visited = new Set();
  while (stack.length) {
    const cur = stack.pop();
    if (visited.has(cur)) continue;
    visited.add(cur);
    state.dones.filter(d => d.todoId === cur).forEach(d => total += durationMin(d.start, d.end));
    getChildren(cur).forEach(c => stack.push(c.id));
  }
  return total;
}
function todoDoneCount(id) {
  let n = 0;
  const stack = [id]; const visited = new Set();
  while (stack.length) {
    const cur = stack.pop();
    if (visited.has(cur)) continue; visited.add(cur);
    n += state.dones.filter(d => d.todoId === cur).length;
    getChildren(cur).forEach(c => stack.push(c.id));
  }
  return n;
}
function hasChildren(id) { return state.todos.some(t => t.parentId === id); }

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('show'), 1800);
}

/* ============================================================
   NAV
   ============================================================ */
document.querySelectorAll('.nav-item').forEach(n => {
  n.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
    n.classList.add('active');
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('v-' + n.dataset.view).classList.add('active');
    document.getElementById('sidebar').classList.remove('open');
    renderAll();
  });
});

/* ============================================================
   DASHBOARD
   ============================================================ */
function renderDash() {
  const now = new Date();
  const h = now.getHours();
  const greet = h < 6 ? '夜深了' : h < 12 ? '早上好' : h < 14 ? '中午好' : h < 18 ? '下午好' : '晚上好';
  document.getElementById('dashGreet').textContent = greet + '，开始今天的工作吧';
  document.getElementById('dashSub').textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 · ${['日','一','二','三','四','五','六'][now.getDay()]}`;
  document.getElementById('greetDate').textContent = `${now.getMonth()+1}月${now.getDate()}日 周${['日','一','二','三','四','五','六'][now.getDay()]}`;

  const today = fmtDate(now);
  const todayDones = state.dones.filter(d => d.date === today);
  const todayMin = todayDones.reduce((s,d)=>s+durationMin(d.start,d.end), 0);

  const ws = startOfWeek(now);
  const weekDones = state.dones.filter(d => {
    const dt = new Date(d.date);
    return dt >= ws && dt < new Date(ws.getTime()+7*86400000);
  });
  const weekMin = weekDones.reduce((s,d)=>s+durationMin(d.start,d.end), 0);

  document.getElementById('statWeekTime').innerHTML = `${(weekMin/60).toFixed(1)}<small>小时</small>`;
  document.getElementById('statWeekCount').innerHTML = `${weekDones.length}<small>条</small>`;
  document.getElementById('statTodoTotal').innerHTML = `${state.todos.length}<small>项</small>`;

  const todayHabit = state.habits.filter(h => {
    const r = h.records.find(r => r.date === today);
    return r && (h.type === 'check' ? r.value : r.value > 0);
  }).length;
  document.getElementById('statHabitToday').innerHTML = `${todayHabit}<small>/${state.habits.length}</small>`;

  // today done list
  const tdList = document.getElementById('dashTodayDone');
  if (todayDones.length === 0) {
    tdList.innerHTML = '<div class="tree-empty">今天还没有记录</div>';
  } else {
    tdList.innerHTML = todayDones.map(d => {
      const t = getTodo(d.todoId);
      const color = t ? todoColor(t.id) : 'var(--module-3)';
      return `<div class="mini-item"><span class="dot" style="background:${color}"></span><span style="flex:1">${d.title}</span><span class="time">${d.start}-${d.end}</span></div>`;
    }).join('');
  }

  // ongoing todos (top-level not done)
  const ongoing = state.todos.filter(t => !t.done && !t.parentId).slice(0, 6);
  const ogList = document.getElementById('dashOngoing');
  if (ongoing.length === 0) {
    ogList.innerHTML = '<div class="tree-empty">暂无进行中的待办</div>';
  } else {
    ogList.innerHTML = ongoing.map(t => {
      const mins = todoTime(t.id);
      const cnt = todoDoneCount(t.id);
      return `<div class="mini-item"><span class="dot" style="background:${todoColor(t.id)}"></span><span style="flex:1">${t.title}</span><span class="time">${cnt}条 · ${fmtMin(mins)}</span></div>`;
    }).join('');
  }
}

/* ============================================================
   TODOS (mind map)
   ============================================================ */
const TODO_COLORS = ['#6f8f6a','#5f7a99','#bd8a4e','#b5715a','#7d7195'];
function todoColor(id) {
  // color based on root ancestor
  let cur = getTodo(id);
  while (cur && cur.parentId) cur = getTodo(cur.parentId);
  if (!cur) return TODO_COLORS[0];
  const roots = state.todos.filter(t => !t.parentId);
  const idx = roots.findIndex(t => t.id === cur.id);
  return TODO_COLORS[idx % TODO_COLORS.length];
}

function renderTodos() {
  const tree = document.getElementById('todoTree');
  const roots = getChildren(null);
  if (roots.length === 0) {
    tree.innerHTML = '<div class="tree-empty">还没有待办，点击「添加根待办」开始组织你的工作</div>';
    return;
  }
  tree.innerHTML = roots.map(t => renderNode(t)).join('');
  bindTodoEvents();
}

function renderNode(t) {
  const children = getChildren(t.id);
  const hasChild = children.length > 0;
  const time = todoTime(t.id);
  const cnt = todoDoneCount(t.id);
  const color = todoColor(t.id);
  const caret = hasChild
    ? `<span class="caret has-child ${t.expanded?'open':''}" data-act="toggle" data-id="${t.id}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>`
    : `<span class="caret"></span>`;
  return `
    <div class="tnode" data-id="${t.id}">
      <div class="tnode-row">
        ${caret}
        <span class="cb ${t.done?'checked':''}" data-act="done" data-id="${t.id}">${t.done?'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>':''}</span>
        <span class="t-title ${t.done?'done':''}" data-act="rename" data-id="${t.id}" title="点击编辑">${esc(t.title)}</span>
        <span class="t-meta">
          ${cnt>0?`<span class="chip time">⏱ ${fmtMin(time)}</span>`:''}
          ${t.note?`<span class="chip note" data-act="note" data-id="${t.id}" title="${esc(t.note)}">📝</span>`:''}
        </span>
        <span class="t-actions">
          <span class="icon-btn" data-act="addchild" data-id="${t.id}" title="添加子项"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span>
          <span class="icon-btn" data-act="move" data-id="${t.id}" title="移动到"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l-3 3 3 3"/><path d="M9 5l3-3 3 3"/><path d="M15 19l-3 3-3-3"/><path d="M19 9l3 3-3 3"/><path d="M2 12h20"/><path d="M12 2v20"/></svg></span>
          <span class="icon-btn" data-act="del" data-id="${t.id}" title="删除"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/></svg></span>
        </span>
      </div>
      ${hasChild && t.expanded ? `<div class="tree-children">${children.map(c=>renderNode(c)).join('')}</div>` : ''}
    </div>`;
}

function bindTodoEvents() {
  document.querySelectorAll('#todoTree [data-act]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const id = el.dataset.id, act = el.dataset.act;
      if (act === 'toggle') { const t = getTodo(id); t.expanded = !t.expanded; save(); renderTodos(); }
      else if (act === 'done') { const t = getTodo(id); t.done = !t.done; save(); renderTodos(); renderAll(); }
      else if (act === 'rename') startRename(el, id);
      else if (act === 'addchild') addChild(id);
      else if (act === 'del') delTodo(id);
      else if (act === 'note') editNote(id);
      else if (act === 'move') moveTodo(id);
    });
  });
}

function startRename(el, id) {
  el.setAttribute('contenteditable', 'true');
  el.focus();
  const range = document.createRange(); range.selectNodeContents(el);
  const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
  const finish = () => {
    el.removeAttribute('contenteditable');
    const txt = el.textContent.trim();
    if (txt) { getTodo(id).title = txt; save(); }
    renderTodos();
  };
  el.addEventListener('blur', finish, { once: true });
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
    if (e.key === 'Escape') { el.textContent = getTodo(id).title; el.blur(); }
  });
}

function addChild(parentId) {
  const t = { id: uid(), title: '新待办', parentId, note: '', done: false, expanded: false, order: state.todos.filter(x=>x.parentId===parentId).length };
  state.todos.push(t);
  const parent = getTodo(parentId);
  if (parent) parent.expanded = true;
  save(); renderTodos();
}
document.getElementById('addRootTodo').addEventListener('click', () => addChild(null));

function delTodo(id) {
  const t = getTodo(id);
  if (!t) return;
  // collect all descendants
  const del = [id];
  const q = [id];
  while (q.length) {
    const c = q.shift();
    state.todos.filter(x=>x.parentId===c).forEach(x=>{ del.push(x.id); q.push(x.id); });
  }
  const n = del.length;
  if (!confirm(`确定删除「${t.title}」及其 ${n-1} 个子项？相关已办记录将解除关联。`)) return;
  state.todos = state.todos.filter(x => !del.includes(x.id));
  state.dones.forEach(d => { if (del.includes(d.todoId)) d.todoId = null; });
  save(); renderTodos(); renderAll(); toast('已删除');
}

function editNote(id) {
  const t = getTodo(id);
  openModal('备注：' + t.title, `
    <div class="field"><textarea id="noteInput" placeholder="随意写下想法、备注、灵感...">${esc(t.note||'')}</textarea></div>
  `, () => {
    t.note = document.getElementById('noteInput').value;
    save(); renderTodos(); closeModal(); toast('备注已保存');
  });
}

function moveTodo(id) {
  const t = getTodo(id);
  // candidate parents: all todos except this and its descendants
  const desc = new Set([id]);
  const q = [id];
  while (q.length) { const c = q.shift(); state.todos.filter(x=>x.parentId===c).forEach(x=>{desc.add(x.id);q.push(x.id);}); }
  const opts = state.todos.filter(x => !desc.has(x.id));
  const html = `<div class="field"><label>移动到（作为子项）</label>
    <select id="moveSel"><option value="">— 根级 —</option>${opts.map(o=>`<option value="${o.id}" ${o.id===t.parentId?'selected':''}>${esc(o.title)}</option>`).join('')}</select></div>`;
  openModal('移动待办', html, () => {
    t.parentId = document.getElementById('moveSel').value || null;
    save(); renderTodos(); closeModal(); toast('已移动');
  });
}

document.getElementById('expandAll').addEventListener('click', () => { state.todos.forEach(t=>t.expanded=true); save(); renderTodos(); });
document.getElementById('collapseAll').addEventListener('click', () => { state.todos.forEach(t=>t.expanded=false); save(); renderTodos(); });

/* ============================================================
   CALENDAR
   ============================================================ */
const DOWS = ['一','二','三','四','五','六','日'];

function renderCal() {
  const m = state.calMonth;
  const y = m.getFullYear(), mo = m.getMonth();
  document.getElementById('calTitle').textContent = `${y}年${mo+1}月`;
  document.getElementById('calDows').innerHTML = DOWS.map(d=>`<div class="cal-dow">${d}</div>`).join('');

  const first = new Date(y, mo, 1);
  const startDay = (first.getDay()+6)%7; // Mon=0
  const daysInMonth = new Date(y, mo+1, 0).getDate();
  const today = fmtDate(new Date());
  const cells = [];
  for (let i=0; i<startDay; i++) {
    const d = new Date(y, mo, i - startDay + 1);
    cells.push({ date: fmtDate(d), other: true });
  }
  for (let i=1; i<=daysInMonth; i++) cells.push({ date: fmtDate(new Date(y,mo,i)), other: false });
  while (cells.length % 7 !== 0) {
    const last = new Date(cells[cells.length-1].date);
    last.setDate(last.getDate()+1);
    cells.push({ date: fmtDate(last), other: true });
  }

  const grid = document.getElementById('calGrid');
  grid.innerHTML = cells.map(c => {
    const dones = state.dones.filter(d => d.date === c.date);
    const blocks = dones.slice(0,3).map(d => {
      const color = d.todoId ? todoColor(d.todoId) : 'var(--module-3)';
      return `<div class="cal-block" style="border-left-color:${color}">${d.start} ${esc(d.title)}</div>`;
    }).join('');
    const more = dones.length > 3 ? `<div class="cal-block more">+${dones.length-3} 更多</div>` : '';
    return `<div class="cal-cell ${c.other?'other':''} ${c.date===today?'today':''}" data-date="${c.date}">
      <div class="cal-num">${new Date(c.date).getDate()}</div>
      ${blocks}${more}
    </div>`;
  }).join('');

  grid.querySelectorAll('.cal-cell').forEach(c => {
    c.addEventListener('click', () => openDay(c.dataset.date));
  });

  // legend
  const roots = state.todos.filter(t => !t.parentId);
  const legend = document.getElementById('calLegend');
  legend.innerHTML = roots.slice(0,8).map(r => `<div class="lg"><span class="sw" style="background:${todoColor(r.id)}"></span>${esc(r.title)}</div>`).join('')
    + (state.dones.some(d=>!d.todoId) ? '<div class="lg"><span class="sw" style="background:var(--module-3)"></span>未关联</div>' : '');
}

document.getElementById('prevMonth').addEventListener('click', () => { state.calMonth = new Date(state.calMonth.getFullYear(), state.calMonth.getMonth()-1, 1); renderCal(); });
document.getElementById('nextMonth').addEventListener('click', () => { state.calMonth = new Date(state.calMonth.getFullYear(), state.calMonth.getMonth()+1, 1); renderCal(); });

function openDay(date) {
  const dones = state.dones.filter(d => d.date === date).sort((a,b)=>a.start.localeCompare(b.start));
  const list = dones.length === 0
    ? '<div class="tree-empty">这一天还没有记录</div>'
    : dones.map(d => {
        const t = getTodo(d.todoId);
        const color = t ? todoColor(d.todoId) : 'var(--module-3)';
        return `<div class="day-rec">
          <div class="bar" style="background:${color}"></div>
          <div class="rbody">
            <div class="rtitle">${esc(d.title)} <span style="font-weight:400;color:var(--text-secondary);font-size:12px;">${t?'· '+esc(t.title):''}</span></div>
            <div class="rmeta">${d.start}–${d.end}（${fmtMin(durationMin(d.start,d.end))}）</div>
            ${d.note?`<div class="rnote">${esc(d.note)}</div>`:''}
          </div>
          <span class="icon-btn" onclick="delDone('${d.id}')" title="删除"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/></svg></span>
        </div>`;
      }).join('');

  const todoOpts = '<option value="">— 不关联 —</option>' + state.todos.map(t => {
    const depth = ancestorDepth(t.id);
    return `<option value="${t.id}">${'　'.repeat(depth)}${esc(t.title)}</option>`;
  }).join('');

  const html = `
    <div class="day-records">${list}</div>
    <h4 style="font-size:14px;margin-bottom:12px;color:var(--text-secondary);">添加记录</h4>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <div class="field" style="grid-column:1/-1"><label>做了什么</label><input type="text" id="dTitle" placeholder="例如：撰写需求文档"></div>
      <div class="field"><label>关联待办</label><select id="dTodo">${todoOpts}</select></div>
      <div class="field"><label>日期</label><input type="date" id="dDate" value="${date}"></div>
      <div class="field"><label>开始</label><input type="time" id="dStart" value="09:00"></div>
      <div class="field"><label>结束</label><input type="time" id="dEnd" value="10:00"></div>
      <div class="field" style="grid-column:1/-1"><label>备注 / 想法</label><textarea id="dNote" placeholder="记录想法、进展、收获..."></textarea></div>
    </div>
  `;
  openModal(date + ' 时间块', html, () => {
    const title = document.getElementById('dTitle').value.trim();
    if (!title) { toast('请填写内容'); return; }
    const start = document.getElementById('dStart').value;
    const end = document.getElementById('dEnd').value;
    state.dones.push({
      id: uid(), title, todoId: document.getElementById('dTodo').value || null,
      date: document.getElementById('dDate').value, start, end,
      note: document.getElementById('dNote').value.trim()
    });
    save(); renderAll(); closeModal(); toast('已添加');
  });
}

function ancestorDepth(id) {
  let d = 0, t = getTodo(id);
  while (t && t.parentId) { d++; t = getTodo(t.parentId); }
  return d;
}

function delDone(id) {
  if (!confirm('删除这条已办记录？')) return;
  state.dones = state.dones.filter(d => d.id !== id);
  save(); renderAll(); closeModal(); toast('已删除');
}

/* ============================================================
   STATISTICS
   ============================================================ */
function renderStat() {
  const ws = state.statWeek;
  const we = new Date(ws.getTime() + 7*86400000);
  document.getElementById('weekRange').textContent = `${ws.getMonth()+1}/${ws.getDate()} – ${we.getMonth()+1}/${we.getDate()}`;
  const weekDones = state.dones.filter(d => {
    const dt = new Date(d.date); return dt >= ws && dt < we;
  });
  const weekMin = weekDones.reduce((s,d)=>s+durationMin(d.start,d.end),0);
  document.getElementById('weekTotal').textContent = (weekMin/60).toFixed(1);
  document.getElementById('weekCount').textContent = weekDones.length;

  // bar chart
  const bars = [];
  let maxMin = 1;
  for (let i=0; i<7; i++) {
    const d = new Date(ws.getTime()+i*86400000);
    const ds = state.dones.filter(x => x.date === fmtDate(d));
    const mins = ds.reduce((s,x)=>s+durationMin(x.start,x.end),0);
    maxMin = Math.max(maxMin, mins);
    bars.push({ day: DOWS[i], mins, count: ds.length, date: fmtDate(d) });
  }
  document.getElementById('barChart').innerHTML = bars.map(b => `
    <div class="bar-col">
      <div class="bar-wrap"><div class="bar" style="height:${(b.mins/maxMin*100)}%"><span class="tv">${b.mins>0?fmtMin(b.mins):''}</span></div></div>
      <div class="dl">${b.day}<br><span style="color:var(--text-tertiary);font-weight:400">${b.count}条</span></div>
    </div>
  `).join('');

  // per-todo stats
  const todoMap = {};
  weekDones.forEach(d => {
    const k = d.todoId || '__none';
    if (!todoMap[k]) todoMap[k] = { mins: 0, items: [] };
    todoMap[k].mins += durationMin(d.start, d.end);
    todoMap[k].items.push(d);
  });
  const todoRows = Object.entries(todoMap).filter(([k])=>k!=='__none').map(([id, v]) => {
    const t = getTodo(id);
    return { id, title: t ? t.title : '(已删除)', mins: v.mins, items: v.items };
  }).sort((a,b)=>b.mins-a.mins);

  document.getElementById('todoStats').innerHTML = todoRows.length === 0
    ? '<div class="tree-empty">本周暂无关联已办</div>'
    : todoRows.map(r => `
      <div class="todo-stat-row" onclick="this.nextElementSibling.classList.toggle('show')">
        <span class="ts-title">${esc(r.title)}</span>
        <span class="ts-time">${fmtMin(r.mins)}</span>
      </div>
      <div class="breakdown">
        ${r.items.map(it => `<div class="bd-item"><span class="bd-date">${it.date} ${it.start}-${it.end}</span><span class="bd-time">${fmtMin(durationMin(it.start,it.end))}</span><div>${esc(it.title)}</div>${it.note?`<div class="bd-note">${esc(it.note)}</div>`:''}</div>`).join('')}
      </div>
    `).join('');

  const orphans = (todoMap['__none'] || { items: [] }).items;
  document.getElementById('orphanStats').innerHTML = orphans.length === 0
    ? '<div class="tree-empty">无</div>'
    : orphans.map(it => `<div class="bd-item"><span class="bd-date">${it.date} ${it.start}-${it.end}</span><span class="bd-time">${fmtMin(durationMin(it.start,it.end))}</span><div>${esc(it.title)}</div>${it.note?`<div class="bd-note">${esc(it.note)}</div>`:''}</div>`).join('');
}

document.getElementById('prevWeek').addEventListener('click', () => { state.statWeek = new Date(state.statWeek.getTime()-7*86400000); renderStat(); });
document.getElementById('nextWeek').addEventListener('click', () => { state.statWeek = new Date(state.statWeek.getTime()+7*86400000); renderStat(); });

/* ============================================================
   HABITS
   ============================================================ */
function renderHabits() {
  const grid = document.getElementById('habitGrid');
  if (state.habits.length === 0) {
    grid.innerHTML = '<div class="tree-empty">还没有习惯，点击「添加习惯」开始</div>';
    return;
  }
  const today = fmtDate(new Date());
  const last7 = [];
  for (let i=6; i>=0; i--) {
    const d = new Date(); d.setDate(d.getDate()-i);
    last7.push(fmtDate(d));
  }
  grid.innerHTML = state.habits.map(h => {
    const todayRec = h.records.find(r => r.date === today);
    const todayVal = todayRec ? todayRec.value : (h.type==='check' ? false : 0);
    const streak = calcStreak(h);
    const weekCells = last7.map(d => {
      const r = h.records.find(x => x.date === d);
      const done = r && (h.type==='check' ? r.value : r.value > 0);
      const isToday = d === today;
      return `<div class="hw-cell ${done?'done':''} ${isToday?'today':''}" title="${d}${r?(' '+formatHabitVal(h,r.value)):''}">${d.slice(8)}</div>`;
    }).join('');

    let inputHtml;
    if (h.type === 'check') {
      inputHtml = `<button class="check-btn ${todayVal?'checked':''}" onclick="toggleHabit('${h.id}')">${todayVal?'✓ 今日已完成':'点击打卡'}</button>`;
    } else if (h.type === 'number') {
      inputHtml = `<div class="habit-input">
        <button class="step-btn" onclick="stepHabit('${h.id}',-1)">−</button>
        <span class="val">${todayVal}</span>
        <button class="step-btn" onclick="stepHabit('${h.id}',1)">+</button>
        <span style="color:var(--text-secondary);font-size:13px;">${h.unit}</span>
      </div>`;
    } else { // time
      inputHtml = `<div class="habit-input">
        <input type="number" step="0.5" min="0" max="24" value="${todayVal}" style="width:80px;" onchange="setHabit('${h.id}', parseFloat(this.value)||0)">
        <span style="color:var(--text-secondary);font-size:13px;">${h.unit}</span>
      </div>`;
    }

    return `<div class="card habit-card">
      <div class="habit-top">
        <span class="habit-emoji">${h.emoji}</span>
        <div><div class="habit-name">${esc(h.name)}</div><div class="habit-streak">🔥 连续 ${streak} 天</div></div>
      </div>
      <div class="habit-week">${weekCells}</div>
      ${inputHtml}
      <div class="habit-foot"><span style="font-size:11.5px;color:var(--text-tertiary);">最近7天</span>
        <button class="del-habit" onclick="delHabit('${h.id}')">删除</button></div>
    </div>`;
  }).join('');
}

function formatHabitVal(h, v) {
  if (h.type === 'check') return v ? '已打卡' : '未打卡';
  return v + h.unit;
}

function calcStreak(h) {
  let streak = 0;
  const d = new Date();
  while (true) {
    const ds = fmtDate(d);
    const r = h.records.find(x => x.date === ds);
    const done = r && (h.type==='check' ? r.value : r.value > 0);
    if (done) { streak++; d.setDate(d.getDate()-1); }
    else {
      // if today not done yet, don't break streak (allow yesterday)
      if (ds === fmtDate(new Date()) && streak === 0) { d.setDate(d.getDate()-1); continue; }
      break;
    }
  }
  return streak;
}

function setHabitRecord(h, val) {
  const today = fmtDate(new Date());
  const r = h.records.find(x => x.date === today);
  if (r) r.value = val; else h.records.push({ date: today, value: val });
}
function toggleHabit(id) {
  const h = state.habits.find(x => x.id === id); if (!h) return;
  const today = fmtDate(new Date());
  const r = h.records.find(x => x.date === today);
  const cur = r ? r.value : false;
  setHabitRecord(h, !cur);
  save(); renderHabits(); renderDash();
}
function stepHabit(id, delta) {
  const h = state.habits.find(x => x.id === id); if (!h) return;
  const today = fmtDate(new Date());
  const r = h.records.find(x => x.date === today);
  const cur = r ? r.value : 0;
  setHabitRecord(h, Math.max(0, cur + delta));
  save(); renderHabits(); renderDash();
}
function setHabit(id, val) {
  const h = state.habits.find(x => x.id === id); if (!h) return;
  setHabitRecord(h, val);
  save(); renderHabits(); renderDash();
}
function delHabit(id) {
  if (!confirm('删除这个习惯？历史记录也会清除。')) return;
  state.habits = state.habits.filter(h => h.id !== id);
  save(); renderHabits(); toast('已删除');
}

document.getElementById('addHabit').addEventListener('click', () => {
  const html = `
    <div class="field"><label>习惯名称</label><input type="text" id="hName" placeholder="例如：跑步"></div>
    <div class="field"><label>图标 (emoji)</label><input type="text" id="hEmoji" value="🌟" placeholder="emoji"></div>
    <div class="field"><label>记录类型</label>
      <select id="hType">
        <option value="check">打卡（完成/未完成）</option>
        <option value="number">数值（如喝水杯数）</option>
        <option value="time">时长（如睡眠小时）</option>
      </select>
    </div>
    <div class="field"><label>单位（数值/时长类型）</label><input type="text" id="hUnit" placeholder="杯 / 小时 / 页"></div>
  `;
  openModal('添加习惯', html, () => {
    const name = document.getElementById('hName').value.trim();
    if (!name) { toast('请填写名称'); return; }
    state.habits.push({
      id: uid(), name, emoji: document.getElementById('hEmoji').value.trim() || '🌟',
      type: document.getElementById('hType').value, unit: document.getElementById('hUnit').value.trim(),
      records: []
    });
    save(); renderHabits(); closeModal(); toast('已添加');
  });
});

/* ============================================================
   MODAL
   ============================================================ */
function openModal(title, bodyHtml, onConfirm) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalFoot').innerHTML = `
    <button class="btn" id="modalCancel">取消</button>
    <button class="btn primary" id="modalOk">确定</button>`;
  document.getElementById('modalMask').classList.add('show');
  document.getElementById('modalCancel').onclick = closeModal;
  document.getElementById('modalOk').onclick = onConfirm;
  setTimeout(() => { const f = document.querySelector('#modalBody input, #modalBody textarea'); if (f) f.focus(); }, 50);
}
function closeModal() { document.getElementById('modalMask').classList.remove('show'); }
document.getElementById('modalMask').addEventListener('click', e => { if (e.target.id === 'modalMask') closeModal(); });

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

/* ============================================================
   RENDER ALL
   ============================================================ */
function renderAll() {
  renderDash();
  renderTodos();
  renderCal();
  renderStat();
  renderHabits();
}

// init
load();
renderAll();
</script>
</body>
</html>
